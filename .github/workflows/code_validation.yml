name: PyTorch Code Validation 🚀

# Yeh script tab chalegi jab bhi aap main branch par koi code push karenge
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-code:
    runs-on: ubuntu-latest # GitHub background mein Ubuntu machine chalaye ga

    steps:
    # 1. Repository ka code fetch karna
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 2. Python Environment Setup karna
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    # 3. Core Libraries Install karna (Taaki code crash na ho)
    - name: Install PyTorch and Data Science Stack
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy pandas matplotlib seaborn

    # 4. Syntax aur Code Quality Errors Check karna (Linting)
    - name: Check for Python Syntax Errors
      run: |
        # Pure code ko scan karna aur syntax issues check karna
        python -m py_compile $(find . -name "*.py") || echo "No standalone python files found"
